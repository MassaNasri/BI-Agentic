name: P0-C release gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_ENV: test
  DJANGO_EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
  EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
  OPENROUTER_API_KEY: ""
  CREDENTIAL_SECRET_KEY: "biavora-p0c-test-only-credential-key"
  PYTHONHASHSEED: "0"
  PYTHONPATH: ${{ github.workspace }}

jobs:
  current-tree-secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan checked-out source without exposing findings
        run: |
          docker run --rm -v "$PWD:/repo:ro" \
            ghcr.io/gitleaks/gitleaks@sha256:b5918eb91b8d2473cec722f066abb4352e4ffdc4ec9f4283ec143aba9ec9ebc4 \
            dir --redact --no-banner --log-level error /repo

  static-and-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python syntax and merge-marker gate
        run: python scripts/p0c_static_check.py
      - name: Release workflow contract
        run: |
          python -m pip install PyYAML==6.0.2
          python scripts/verify_release_workflow.py
      - name: POSIX script syntax
        run: bash -n scripts/test.sh scripts/check-migration-drift.sh scripts/run-migrations.sh scripts/start_project.sh
      - name: Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Clean dependency install
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Tests
        working-directory: frontend
        run: npm test
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Production build
        working-directory: frontend
        run: npm run build
      - name: Production bundle policy
        run: python scripts/verify_frontend_bundle.py

  backend-and-ai:
    runs-on: ubuntu-latest
    services:
      visualization-postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: visualization_ci
          POSTGRES_USER: visualization_ci
          POSTGRES_PASSWORD: visualization_ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U visualization_ci -d visualization_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install service test dependencies
        run: |
          python -m pip install --upgrade pip "setuptools<81" wheel
          pip install -r services/query-service/requirements.txt -r services/visualization-service/requirements.txt -r services/voice-service/requirements.txt -r services/report-service/requirements.txt -r services/auth-service/requirements.txt -r services/workspace-service/requirements.txt -r services/subscription-service/requirements.txt -r services/notification-service/requirements.txt -r services/ai-service/requirements.txt pytest
      - name: Shared readiness and request IDs
        run: python -m pytest tests/test_health_readiness.py -q --junitxml=test-results/shared-readiness.xml
      - name: Foundation-B shared boundary tests
        run: python -m pytest tests/test_secret_config.py tests/test_upload_policy.py tests/test_audio_cleanup.py -q
      - name: Mounted source-secret delivery contract
        run: python -m pytest tests/test_foundation_c5_secret_delivery.py -q
      - name: Query tests
        working-directory: services/query-service
        run: python -m pytest tests -q --junitxml=../../test-results/query.xml
      - name: Integration ownership tests
        working-directory: services/query-service
        run: python manage.py test integration --settings=service_config.sqlite_test_settings --verbosity 1
      - name: Gateway public contract tests
        working-directory: services/api-gateway
        run: python manage.py test gateway.tests --verbosity 1
      - name: Registered public route and Gateway classification
        run: python scripts/verify_foundation_c6_public_routes.py
      - name: Visualization tests
        working-directory: services/visualization-service
        env:
          DB_NAME: visualization_ci
          DB_USER: visualization_ci
          DB_PASSWORD: visualization_ci_test_password
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
        run: python -m pytest visualization_api/tests -q --junitxml=../../test-results/visualization.xml
      - name: Voice tests
        working-directory: services/voice-service
        run: python -m pytest voice_reports/tests_ai_trace_service.py voice_reports/tests_query_execute_metabase_fallback.py voice_reports/tests_query_service_contract.py voice_reports/tests_security_workspace_authorization.py voice_reports/tests_upload_security.py -q --junitxml=../../test-results/voice.xml
      - name: Report tests
        working-directory: services/report-service
        run: python -m pytest voice_reports/tests_sql_normalization.py -q --junitxml=../../test-results/report.xml
      - name: Auth and Workspace security tests
        run: |
          (cd services/auth-service && python manage.py test users.tests_security_invitation --verbosity 1)
          (cd services/workspace-service && python manage.py test workspace.tests_security_invitation --verbosity 1)
      - name: Subscription and Notification smoke/security tests
        run: |
          (cd services/subscription-service && python manage.py test subscription.tests --verbosity 1)
          (cd services/notification-service && python manage.py test notification.tests --verbosity 1)
      - name: Deterministic AI tests
        working-directory: services/ai-service
        run: >-
          python -m pytest
          intent_extraction/tests.py llm_app/tests.py preprocessing_high/tests_llm_client.py preprocessing_high/tests_recovery.py
          reasoning_app/tests.py shared/tests_sql_review.py tests/test_bi_generalized_semantics_pipeline.py tests/test_bi_hardening.py
          tests/test_bi_semantic_layer.py tests/test_bi_semantic_reasoning_integration.py tests/test_bi_temporal_semantics.py
          tests/test_forecasting_pipeline.py tests/test_pipeline_integration.py tests/test_preprocessing_high_recovery.py
          tests/test_preprocessing_low_semantic_guard.py tests/test_tiered_resolution.py tests/test_value_index.py tests/test_voice_upload_duration.py whisper_app/tests.py
          -q --junitxml=../../test-results/ai.xml
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-junit
          path: test-results/*.xml

  etl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ETL test dependencies
        run: |
          python -m pip install --upgrade pip "setuptools<81" wheel
          pip install -r etl-final/shared/requirements.txt -r etl-final/connector-service/requirements.txt -r etl-final/detector-service/requirements.txt -r etl-final/extractor-service/requirements.txt -r etl-final/transformer-service/requirements.txt -r etl-final/loader-service/requirements.txt -r etl-final/metadata-service/requirements.txt -r etl-final/requirements-test.txt
      - name: Maintained ETL suites
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/etl-final
        run: |
          python -m pytest etl-final/shared/models etl-final/shared/security -q
          for test_file in etl-final/shared/utils/test_*.py; do
            case "$(basename "$test_file")" in test_bronze_indexes.py|test_kafka_validation_integration.py) continue;; esac
            python -m pytest "$test_file" -q
          done
          (cd etl-final/connector-service/connector && python manage.py test --verbosity 1)
          python -m pytest etl-final/extractor-service/extractor/engine -q
          python -m pytest etl-final/transformer-service/transformer/engine -q
          python -m pytest etl-final/loader-service/loader/engine -q
          python -m pytest etl-final/tests/test_p0_transform_loader_listeners.py -q
          (cd etl-final/detector-service/detector && python manage.py test --verbosity 1)
          (cd etl-final/metadata-service/metadata && python manage.py test --verbosity 1)

  security-regression:
    needs: [backend-and-ai, etl]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [query, visualization, voice, auth, workspace, etl]
    services:
      visualization-postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: visualization_ci
          POSTGRES_USER: visualization_ci
          POSTGRES_PASSWORD: visualization_ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U visualization_ci -d visualization_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Each matrix runner has one service dependency domain. Voice Kafka 2.0.2
      # and ETL Kafka 2.3.0 must never be resolved in one interpreter.
      - name: Install service-native security dependencies
        run: |
          python -m pip install --upgrade pip 'setuptools<81' wheel
          python scripts/run_security_regression.py ${{ matrix.suite }} --install
      - name: Run every security check for this service
        env:
          DB_NAME: visualization_ci
          DB_USER: visualization_ci
          DB_PASSWORD: visualization_ci_test_password
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
        run: python scripts/run_security_regression.py ${{ matrix.suite }}

  migration-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Django service dependencies
        run: |
          python -m pip install --upgrade pip "setuptools<81" wheel
          pip install -r services/auth-service/requirements.txt -r services/workspace-service/requirements.txt -r services/subscription-service/requirements.txt -r services/notification-service/requirements.txt -r services/voice-service/requirements.txt -r services/query-service/requirements.txt -r services/visualization-service/requirements.txt -r services/report-service/requirements.txt
      - name: Eight-configuration drift gate
        run: bash scripts/check-migration-drift.sh

  docker-build:
    needs: [static-and-compose]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build all maintained images without publishing
        run: |
          cp .env.example .env
          docker compose build

  foundation-c-owner-boundary:
    runs-on: ubuntu-latest
    services:
      owner-postgres:
        image: postgres:18.3
        env:
          POSTGRES_DB: biavora_c4_disposable
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: c4-ci-disposable-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d biavora_c4_disposable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prove owner CRUD, cross-owner denial, and rollback
        env:
          PYTHONPATH: scripts
          BIAVORA_C4_DISPOSABLE: "1"
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          DB_NAME: biavora_c4_disposable
          DB_USER: postgres
          DB_PASSWORD: c4-ci-disposable-only-password
        run: |
          python -m pip install psycopg2-binary==2.9.9
          python scripts/verify_foundation_c4_owner_roles.py
      - name: Install critical-domain service dependencies
        run: |
          python -m pip install --upgrade pip "setuptools<81" wheel
          pip install -r services/auth-service/requirements.txt -r services/workspace-service/requirements.txt -r services/subscription-service/requirements.txt -r services/query-service/requirements.txt
      - name: Production owner environment acceptance and rejection tests
        run: python -m pytest tests/test_owner_boundary_environment.py -q
      - name: Migrate, apply ownership, and prove actual Django service logins
        env:
          APP_ENV: production
          DEBUG: 'false'
          ALLOWED_HOSTS: localhost,127.0.0.1
          CORS_ALLOWED_ORIGINS: ''
          DJANGO_CORS_ALLOWED_ORIGINS: ''
          BIAVORA_C4_ALLOW_OWNER_MIGRATION: "1"
          BIAVORA_C5_DISPOSABLE: "1"
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          DB_NAME: biavora_c5_runtime
          DB_USER: postgres
          DB_PASSWORD: c4-ci-disposable-only-password
        run: |
          python -c 'import os, psycopg2; c=psycopg2.connect(host=os.environ["DB_HOST"], user=os.environ["DB_USER"], password=os.environ["DB_PASSWORD"], dbname="postgres"); c.autocommit=True; c.cursor().execute("CREATE DATABASE biavora_c5_runtime"); c.close()'
          export APP_ENV=production DB_ACCESS_MODE=migration BIAVORA_ALLOW_MIGRATION_ROLE=1
          export DJANGO_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(40))')"
          export INTERNAL_SERVICE_TOKEN="$(python -c 'import secrets; print(secrets.token_urlsafe(40))')"
          export ETL_INTERNAL_API_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(40))')"
          export INGESTION_CALLBACK_API_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(40))')"
          export CLICKHOUSE_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(40))')"
          export CREDENTIAL_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(40))')"
          export CREDENTIAL_RESOLVER_CONNECTOR_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(40))')"
          export CREDENTIAL_RESOLVER_EXTRACTOR_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(40))')"
          for service in auth-service workspace-service subscription-service query-service; do
            (cd "services/$service" && python manage.py migrate --noinput --verbosity 0)
          done
          python -c 'import os, psycopg2; c=psycopg2.connect(host=os.environ["DB_HOST"], dbname=os.environ["DB_NAME"], user=os.environ["DB_USER"], password=os.environ["DB_PASSWORD"]); k=c.cursor(); k.execute("SELECT count(*) FROM information_schema.tables WHERE table_schema=%s AND table_name LIKE %s", ("public", "integration_%")); assert k.fetchone()[0] == 5; c.close()'
          python scripts/foundation_c4_owner_schemas.py apply
          python scripts/verify_foundation_c5_service_roles.py
          python scripts/foundation_c4_owner_schemas.py rollback

  release-gate:
    if: always()
    needs: [current-tree-secret-scan, static-and-compose, frontend, backend-and-ai, etl, security-regression, migration-drift, docker-build, foundation-c-owner-boundary]
    runs-on: ubuntu-latest
    steps:
      - name: Require every P0-C job
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "P0-C job results: ${RESULTS}"
          test "${RESULTS}" = "success success success success success success success success success"
