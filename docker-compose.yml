# Ollama on the Docker host: containers must not use localhost:11434 (that is the
# container loopback). Use host.docker.internal. host-gateway works on Linux engines;
# Docker Desktop on Windows/WSL already provides host.docker.internal.
x-ollama-docker-host-env: &ollama-docker-host-env
  SQL_REVIEW_OLLAMA_URL: http://host.docker.internal:11434/api/generate
  SQL_REVIEW_OLLAMA_MODEL: gemma3:1b
  INTENT_CLASSIFIER_OLLAMA_URL: http://host.docker.internal:11434/api/generate
  INTENT_CLASSIFIER_OLLAMA_MODEL: gemma3:1b
  TEXT_PREPROCESS_OLLAMA_URL: http://host.docker.internal:11434/api/generate
  TEXT_PREPROCESS_MODEL: gemma3:1b
  PREPROCESS_HIGH_OLLAMA_URL: http://host.docker.internal:11434/api/generate
  PREPROCESS_HIGH_OLLAMA_MODEL: gemma3:1b
  INTENT_EXTRACTION_OLLAMA_URL: http://host.docker.internal:11434/api/generate
  INTENT_EXTRACTION_OLLAMA_MODEL: gemma3:1b

services:
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ./.env
    environment:
      SERVICE_NAME: api-gateway
      READINESS_CHECK_DATABASE: "false"
      READINESS_HTTP_URLS: http://auth-service:8001/health/,http://workspace-service:8002/health/,http://report-service:8003/health/,http://voice-service:8004/health/,http://ai-service:8005/health/,http://query-service:8006/health/,http://visualization-service:8007/health/,http://subscription-service:8008/health/,http://notification-service:8010/health/
      APP_ENV: ${APP_ENV:-development}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth-service:8001}
      WORKSPACE_SERVICE_URL: ${WORKSPACE_SERVICE_URL:-http://workspace-service:8002}
      REPORT_SERVICE_URL: ${REPORT_SERVICE_URL:-http://report-service:8003}
      VOICE_SERVICE_URL: ${VOICE_SERVICE_URL:-http://voice-service:8004}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:8005}
      QUERY_SERVICE_URL: ${QUERY_SERVICE_URL:-http://query-service:8006}
      VISUALIZATION_SERVICE_URL: ${VISUALIZATION_SERVICE_URL:-http://visualization-service:8007}
      SUBSCRIPTION_SERVICE_URL: ${SUBSCRIPTION_SERVICE_URL:-http://subscription-service:8008}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL:-http://notification-service:8010}
      CLICKHOUSE_HOST: ""
      CLICKHOUSE_PORT: ""
      CLICKHOUSE_USER: ""
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DATABASE: ""
      GATEWAY_RATE_LIMIT_REQUESTS: ${GATEWAY_RATE_LIMIT_REQUESTS:-120}
      GATEWAY_RATE_LIMIT_WINDOW_SECONDS: ${GATEWAY_RATE_LIMIT_WINDOW_SECONDS:-6}
      GATEWAY_UPSTREAM_TIMEOUT_SECONDS: ${GATEWAY_UPSTREAM_TIMEOUT_SECONDS:-360}
    depends_on:
      auth-service:
        condition: service_healthy
      workspace-service:
        condition: service_healthy
      report-service:
        condition: service_healthy
      voice-service:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      query-service:
        condition: service_healthy
      visualization-service:
        condition: service_healthy
      subscription-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready/', timeout=5).read()
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: auth-service
    ports:
      - "127.0.0.1:8001:8001"
    env_file:
      - ./.env
    environment:
      SERVICE_NAME: auth-service
      APP_ENV: ${APP_ENV:-development}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/ready/', timeout=5).read()
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  workspace-service:
    build:
      context: .
      dockerfile: services/workspace-service/Dockerfile
    container_name: workspace-service
    ports:
      - "127.0.0.1:8002:8002"
    env_file:
      - ./.env
    environment:
      SERVICE_NAME: workspace-service
      READINESS_HTTP_URLS: http://auth-service:8001/health/
      APP_ENV: ${APP_ENV:-development}
    depends_on:
      auth-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/ready/', timeout=5).read()
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  report-service:
    build:
      context: .
      dockerfile: services/report-service/Dockerfile
    container_name: report-service
    ports:
      - "127.0.0.1:8003:8003"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ./.env
    environment:
      SERVICE_NAME: report-service
      READINESS_TCP_TARGETS: ""
      READINESS_HTTP_URLS: http://etl-metadata:8000/api/ready/,http://query-service:8006/health/,http://metabase:3000/api/health
      APP_ENV: ${APP_ENV:-development}
      CLICKHOUSE_HOST: ""
      CLICKHOUSE_PORT: ""
      CLICKHOUSE_USER: ""
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DATABASE: ""
      METADATA_SERVICE_URL: ${METADATA_SERVICE_URL:-http://etl-metadata:8000}
      METABASE_URL: http://metabase:3000
    depends_on:
      etl-metadata:
        condition: service_healthy
      query-service:
        condition: service_healthy
      metabase:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/ready/', timeout=5).read()
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  voice-service:
    build:
      context: .
      dockerfile: services/voice-service/Dockerfile
    container_name: voice-service
    ports:
      - "127.0.0.1:8004:8004"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ./.env
    volumes:
      - voice_service_media:/app/media
      - "C:/Users/massa/.cache/huggingface/hub/models--google--timesfm-2.5-200m-pytorch/snapshots/1d952420fba87f3c6dee4f240de0f1a0fbc790e3:/models/timesfm"
    environment:
      SERVICE_NAME: voice-service
      READINESS_TCP_TARGETS: kafka:9092
      READINESS_HTTP_URLS: http://ai-service:8005/health/,http://query-service:8006/health/,http://visualization-service:8007/health/,http://subscription-service:8008/health/,http://metabase:3000/api/health
      APP_ENV: ${APP_ENV:-development}
      SMALL_WHISPER_URL: http://ai-service:8005
      SMALL_WHISPER_HEALTH_TIMEOUT_SECONDS: ${SMALL_WHISPER_HEALTH_TIMEOUT_SECONDS:-5}
      SMALL_WHISPER_CONNECT_TIMEOUT_SECONDS: ${SMALL_WHISPER_CONNECT_TIMEOUT_SECONDS:-10}
      SMALL_WHISPER_TIMEOUT_SECONDS: ${SMALL_WHISPER_TIMEOUT_SECONDS:-300}
      SMALL_WHISPER_MAX_RETRIES: ${SMALL_WHISPER_MAX_RETRIES:-1}
      QUERY_SERVICE_URL: ${QUERY_SERVICE_URL:-http://query-service:8006}
      VISUALIZATION_SERVICE_URL: ${VISUALIZATION_SERVICE_URL:-http://visualization-service:8007}
      SUBSCRIPTION_SERVICE_URL: ${SUBSCRIPTION_SERVICE_URL:-http://subscription-service:8008}
      # Defense in depth: the shared env file must not grant Voice ClickHouse authority.
      CLICKHOUSE_HOST: ""
      CLICKHOUSE_PORT: ""
      CLICKHOUSE_USER: ""
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DATABASE: ""
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      METABASE_URL: http://metabase:3000
    depends_on:
      ai-service:
        condition: service_healthy
      query-service:
        condition: service_healthy
      visualization-service:
        condition: service_healthy
      subscription-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
      metabase:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/ready/', timeout=5).read()
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  ai-service:
    build:
      context: .
      dockerfile: services/ai-service/Dockerfile
    container_name: ai-service
    ports:
      - "127.0.0.1:8005:8005"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - whisper_cache:/root/.cache/whisper
      - "C:/Users/massa/.cache/huggingface/hub/models--google--timesfm-2.5-200m-pytorch/snapshots/1d952420fba87f3c6dee4f240de0f1a0fbc790e3:/models/timesfm"
    env_file:
      - ./.env
    environment:
      <<: *ollama-docker-host-env
      APP_ENV: ${APP_ENV:-development}
      SERVICE_NAME: ai-service
      READINESS_TCP_TARGETS: clickhouse:8123,redis:6379
      DJANGO_SETTINGS_MODULE: backend.settings
      PYTHONPATH: /app
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      PREPROCESS_HIGH_VALUE_INDEX_ENABLED: "false"
      WHISPER_MODEL_NAME: ${WHISPER_MODEL_NAME:-small}
      WHISPER_CACHE_DIR: ${WHISPER_CACHE_DIR:-/root/.cache/whisper}
      WHISPER_TASK: ${WHISPER_TASK:-transcribe}
      TRANSCRIPTION_REDIS_URL: ${TRANSCRIPTION_REDIS_URL:-redis://redis:6379/0}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemma-3n-e4b-it:free}
    depends_on:
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8005/ready/', timeout=5).read()
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis@sha256:8b81dd37ff027bec4e516d41acfbe9fe2460070dc6d4a4570a2ac5b9d59df065
    container_name: redis
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  query-service:
    build:
      context: .
      dockerfile: services/query-service/Dockerfile
    container_name: query-service
    ports:
      - "127.0.0.1:8006:8006"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ./.env
    environment:
      SERVICE_NAME: query-service
      READINESS_TCP_TARGETS: clickhouse:8123,kafka:9092
      READINESS_HTTP_URLS: http://etl-connector:8000/api/ready/,http://etl-metadata:8000/api/ready/,http://subscription-service:8008/health/
      APP_ENV: ${APP_ENV:-development}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      QUERY_MAX_EXECUTION_SECONDS: ${QUERY_MAX_EXECUTION_SECONDS:-30}
      QUERY_MAX_ROWS: ${QUERY_MAX_ROWS:-10000}
      QUERY_MAX_RESULT_BYTES: ${QUERY_MAX_RESULT_BYTES:-5242880}
      QUERY_MAX_BYTES_TO_READ: ${QUERY_MAX_BYTES_TO_READ:-1073741824}
      QUERY_MAX_MEMORY_USAGE: ${QUERY_MAX_MEMORY_USAGE:-536870912}
      QUERY_WORKSPACE_CONCURRENCY: ${QUERY_WORKSPACE_CONCURRENCY:-2}
      QUERY_PAGE_SIZE: ${QUERY_PAGE_SIZE:-500}
      QUERY_MAX_PAGE_SIZE: ${QUERY_MAX_PAGE_SIZE:-1000}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ETL_SERVICE_URL: ${ETL_SERVICE_URL:-http://etl-connector:8000}
      METADATA_SERVICE_URL: ${METADATA_SERVICE_URL:-http://etl-metadata:8000}
      ETL_INTERNAL_API_KEY: ${ETL_INTERNAL_API_KEY:?ETL_INTERNAL_API_KEY must be set}
      INGESTION_CALLBACK_API_KEY: ${INGESTION_CALLBACK_API_KEY:?INGESTION_CALLBACK_API_KEY must be set}
      CREDENTIAL_SECRET_KEY: ${CREDENTIAL_SECRET_KEY:-}
      CREDENTIAL_RESOLVER_API_KEY: ${CREDENTIAL_RESOLVER_API_KEY:-}
      CREDENTIAL_RESOLVER_CONNECTOR_KEY: ${CREDENTIAL_RESOLVER_CONNECTOR_KEY:-}
      CREDENTIAL_RESOLVER_EXTRACTOR_KEY: ${CREDENTIAL_RESOLVER_EXTRACTOR_KEY:-}
      CREDENTIAL_RESOLVER_CONNECTOR_KEY_PREVIOUS: ${CREDENTIAL_RESOLVER_CONNECTOR_KEY_PREVIOUS:-}
      CREDENTIAL_RESOLVER_EXTRACTOR_KEY_PREVIOUS: ${CREDENTIAL_RESOLVER_EXTRACTOR_KEY_PREVIOUS:-}
    depends_on:
      clickhouse:
        condition: service_healthy
      kafka:
        condition: service_healthy
      etl-connector:
        condition: service_healthy
      etl-metadata:
        condition: service_healthy
      subscription-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8006/ready/', timeout=5).read()
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  credential-prune-worker:
    build:
      context: .
      dockerfile: services/query-service/Dockerfile
    container_name: credential-prune-worker
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      SERVICE_NAME: credential-prune-worker
      APP_ENV: ${APP_ENV:-development}
      CREDENTIAL_SECRET_KEY: ${CREDENTIAL_SECRET_KEY:-}
      CREDENTIAL_RESOLVER_CONNECTOR_KEY: ${CREDENTIAL_RESOLVER_CONNECTOR_KEY:-}
      CREDENTIAL_RESOLVER_EXTRACTOR_KEY: ${CREDENTIAL_RESOLVER_EXTRACTOR_KEY:-}
    command: ["python", "manage.py", "run_credential_prune_worker"]
    depends_on:
      query-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import os,time; p='/tmp/credential-prune-heartbeat'; assert os.path.isfile(p) and time.time()-os.path.getmtime(p) < 90
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  visualization-service:
    build:
      context: .
      dockerfile: services/visualization-service/Dockerfile
    container_name: visualization-service
    ports:
      - "127.0.0.1:8007:8007"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ./.env
    environment:
      SERVICE_NAME: visualization-service
      READINESS_HTTP_URLS: http://query-service:8006/health/,http://report-service:8003/health/,http://metabase:3000/api/health
      APP_ENV: ${APP_ENV:-development}
      VISUALIZATION_CHART_SELECTOR_OLLAMA_URL: http://host.docker.internal:11434/api/generate
      VISUALIZATION_CHART_SELECTOR_OLLAMA_MODEL: gemma3:1b
      METABASE_URL: http://metabase:3000
      CLICKHOUSE_HOST: ""
      CLICKHOUSE_PORT: ""
      CLICKHOUSE_USER: ""
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DATABASE: ""
    depends_on:
      query-service:
        condition: service_healthy
      report-service:
        condition: service_healthy
      metabase:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8007/ready/', timeout=5).read()
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  subscription-service:
    build:
      context: .
      dockerfile: services/subscription-service/Dockerfile
    container_name: subscription-service
    ports:
      - "127.0.0.1:8009:8008"
    env_file:
      - ./.env
    environment:
      SERVICE_NAME: subscription-service
      READINESS_HTTP_URLS: http://workspace-service:8002/health/
      APP_ENV: ${APP_ENV:-development}
      PAYMENT_MODE: ${PAYMENT_MODE:-disabled}
    depends_on:
      workspace-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8008/ready/', timeout=5).read()
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: notification-service
    ports:
      - "127.0.0.1:8010:8010"
    env_file:
      - ./.env
    environment:
      SERVICE_NAME: notification-service
      READINESS_HTTP_URLS: http://voice-service:8004/health/
      APP_ENV: ${APP_ENV:-development}
    depends_on:
      voice-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/ready/', timeout=5).read()
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  notification-expiry-worker:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: notification-expiry-worker
    env_file:
      - ./.env
    environment:
      APP_ENV: ${APP_ENV:-development}
    command:
      - sh
      - -c
      - >
        while true; do
          date +%s > /tmp/notification-expiry-heartbeat;
          python manage.py send_expiry_warnings;
          remaining=${NOTIFICATION_EXPIRY_CHECK_INTERVAL_SECONDS:-21600};
          while [ "$$remaining" -gt 0 ]; do
            date +%s > /tmp/notification-expiry-heartbeat;
            step=30; [ "$$remaining" -lt "$$step" ] && step="$$remaining";
            sleep "$$step"; remaining=$$((remaining-step));
          done;
        done
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import os,time; p='/tmp/notification-expiry-heartbeat'; assert os.path.exists(p) and time.time()-os.path.getmtime(p) < 90
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      notification-service:
        condition: service_healthy

  zookeeper:
    image: confluentinc/cp-zookeeper@sha256:02f6c042bb9a7844382fc4cedc513a44585d8a5acae873fb9e510e3ca9dcabc6
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "127.0.0.1:2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
      - zookeeper_secrets:/etc/zookeeper/secrets
    healthcheck:
      test: ["CMD-SHELL", "nc -z -w 2 127.0.0.1 2181"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  kafka:
    image: confluentinc/cp-kafka@sha256:fbbb6fa11b258a88b83f54d4f0bddfcffbf2279f99d66a843486e3da7bdfbf41
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
      - kafka_secrets:/etc/kafka/secrets
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server 127.0.0.1:9092 --list >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  kafka-ui:
    image: provectuslabs/kafka-ui@sha256:8f2ff02d64b0a7a2b71b6b3b3148b85f66d00ec20ad40c30bdcd415d46d31818
    container_name: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

  surrealdb-volume-init:
    image: postgres@sha256:7e32e9833a6fb1c92c32552794cb6ed569d51b445a54907d35fc112ef39684db
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["install -d -o 65532 -g 65532 -m 0700 /data/biavora && chown -R 65532:65532 /data/biavora && chmod 0700 /data/biavora"]
    volumes:
      - surreal_data:/data
    restart: "no"

  surrealdb:
    image: surrealdb/surrealdb@sha256:849c9ad548415ddf06b80d834929ddc43fb9c482d2ef9b51113641a8e47fad63
    container_name: surrealdb
    command: start --user ${SURREAL_USER:?SURREAL_USER must be set} --pass ${SURREAL_PASS:?SURREAL_PASS must be set} --log info rocksdb:///data/biavora/database
    ports:
      - "127.0.0.1:8008:8000"
    volumes:
      - surreal_data:/data
    depends_on:
      surrealdb-volume-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/surreal", "is-ready", "--endpoint", "http://127.0.0.1:8000"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  metabase-db:
    image: postgres@sha256:7e32e9833a6fb1c92c32552794cb6ed569d51b445a54907d35fc112ef39684db
    container_name: metabase-db
    environment:
      POSTGRES_DB: metabase_app
      POSTGRES_USER: metabase_app
      POSTGRES_PASSWORD: ${METABASE_APP_DB_PASSWORD:?METABASE_APP_DB_PASSWORD must be set}
    volumes:
      - metabase_app_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase_app -d metabase_app"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  metabase:
